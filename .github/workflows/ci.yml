name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # A dependency advisory can land without anyone touching this repository.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version, so rustup installs it with the
      # rustfmt and clippy components this workflow needs.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features --locked

      - name: Build release
        run: cargo build --release --locked

  # This plugin reads credential stores and sends bearer tokens to provider
  # billing endpoints, so a known-vulnerable dependency is a security issue,
  # not a chore. The schedule catches advisories published after a merge.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      # ureq 2.x uses webpki-roots 0.26.11, a compatibility shim which
      # re-exports the actual certificate list from webpki-roots 1.x.
      # RUSTSEC-2026-0381 flags the shim version even when the underlying
      # root list is fixed. Fail closed if the shim stops forwarding to the
      # patched 1.0.10 root list, or the TLS verifier is not patched.
      - name: Verify patched certificate dependencies
        run: |
          python3 - <<'PY'
          import sys
          import tomllib

          with open("Cargo.lock", "rb") as handle:
              packages = tomllib.load(handle)["package"]

          def packages_named(name):
              return [p for p in packages if p["name"] == name]

          roots = {p["version"]: p for p in packages_named("webpki-roots")}
          shim = roots.get("0.26.11")
          if set(roots) != {"0.26.11", "1.0.10"} or shim is None:
              sys.exit(f"Unexpected webpki-roots versions: {sorted(roots)}")
          if shim.get("dependencies") != ["webpki-roots 1.0.10"]:
              sys.exit("Legacy webpki-roots shim must forward to patched 1.0.10")

          verifier = packages_named("rustls-webpki")
          if len(verifier) != 1 or verifier[0]["version"] != "0.103.16":
              sys.exit("rustls-webpki must be pinned to patched 0.103.16")
          print("TLS verifier and forwarded certificate roots are patched")
          PY

      # The only remaining match for RUSTSEC-2026-0381 is the 0.26.11
      # compatibility shim verified above; do not suppress other advisories.
      - run: cargo audit --deny warnings --ignore RUSTSEC-2026-0381

  plugin-manifest:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Herdr refuses to load a plugin whose root manifest is missing or
      # malformed, so a broken manifest must fail here rather than on install.
      - name: Validate herdr-plugin.toml
        run: |
          python3 - <<'PY'
          import sys, tomllib
          with open("herdr-plugin.toml", "rb") as handle:
              manifest = tomllib.load(handle)
          for key in ("id", "name", "version", "min_herdr_version", "description"):
              if not manifest.get(key):
                  sys.exit(f"herdr-plugin.toml is missing required key: {key}")
          print("herdr-plugin.toml is valid")
          PY
